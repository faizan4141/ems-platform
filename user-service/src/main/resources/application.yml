server:
  port: 8082
  shutdown: graceful

keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ems
    client-id: ems-user-service
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    invite-client-id: ems-web
    invite-redirect-uri: ${APP_BASE_URL:http://localhost:5173}/
    invite-lifespan-seconds: 259200   # invitation link valid for 3 days

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://localhost:5432/ems?currentSchema=users
    username: ${DB_USERNAME:user_svc}
    password: ${DB_PASSWORD:user_local_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.default_schema]": users
  flyway:
    enabled: true
    schemas: users
    default-schema: users
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": com.ems.user.event.TenantEvent
        "[spring.json.trusted.packages]": com.ems.user.event
        "[spring.json.use.type.headers]": false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ems}

management:
  endpoints:
    web:
      exposure:
        include: health,info
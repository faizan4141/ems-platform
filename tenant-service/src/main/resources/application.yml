server:
  port: 8081

spring:
  application:
    name: tenant-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ems_tenant
    username: ${DB_USERNAME:ems_admin}
    password: ${DB_PASSWORD:ems_local_pass}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_local_pass}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "tenant-service:"
      use-key-prefix: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

management:
  endpoints:
    web:
      exposure:
        include: health,info
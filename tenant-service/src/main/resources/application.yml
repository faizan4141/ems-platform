server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG

spring:
  application:
    name: tenant-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ems?currentSchema=tenant
    username: ${DB_USERNAME:tenant_svc}
    password: ${DB_PASSWORD:tenant_local_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.default_schema]": tenant
  flyway:
    enabled: true
    schemas: tenant
    default-schema: tenant
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_local_pass}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "tenant-service:"
      use-key-prefix: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ems}

management:
  endpoints:
    web:
      exposure:
        include: health,info
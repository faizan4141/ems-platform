version: 2
updates:
  - package-ecosystem: maven
    directories: ["/tenant-service", "/user-service", "/api-gateway"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/ems-web"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/tenant-service", "/user-service", "/api-gateway", "/ems-web"]
    schedule:
      interval: weekly
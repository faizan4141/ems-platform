server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build files never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
    }

    # Must never be cached: it holds this environment's settings.
    location = /config.js {
        expires -1;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Single-page app: unknown paths (like /users) serve index.html and React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
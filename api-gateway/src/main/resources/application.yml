server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_local_pass}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ems}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantKeyResolver}"
          routes:
            - id: tenant-service
              uri: ${TENANT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/tenants/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
            - id: academic-service
              uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/school/**,/api/v1/academic-years/**,/api/v1/classes/**,/api/v1/onboarding/**,/api/v1/students/**,/api/v1/attendance/**,/api/v1/parent/**,/api/v1/notices/**,/api/v1/fees/**,/api/v1/payments/**,/api/v1/subjects/**,/api/v1/grading-scale/**,/api/v1/exams/**

ems:
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info